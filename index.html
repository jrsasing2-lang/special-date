
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Special Date ❤️</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ffb6d5, #ff69a6);
    min-height: 100vh;
    overflow-x: hidden;
}

.container {
    width: 100%;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 20px;
}

h1 {
    color: #d41465;
    font-size: clamp(32px, 8vw, 55px);
    margin-bottom: 15px;
}

p {
    color: #a0004b;
    font-size: clamp(20px, 5vw, 28px);
    margin-bottom: 30px;
}

.buttons {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 25px;
}

button {
    border: none;
    border-radius: 15px;
    padding: 18px 35px;
    font-size: 22px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 5px 12px #d94b86;
}

#yesBtn, #confirmBtn {
    background: #ff1475;
    color: white;
}

#noBtn {
    background: white;
    color: #ff1475;
    position: relative;
}

#datePage, #surprise {
    display: none;
}

input {
    padding: 15px;
    font-size: 20px;
    border: 2px solid #ff1475;
    border-radius: 10px;
    margin: 15px;
}

#surprise {
    position: fixed;
    inset: 0;
    background: linear-gradient(135deg, #ffc1dc, #ff69a6);
    color: #b00050;
    text-align: center;
    padding: 30px 15px;
    overflow-y: auto;
}

.heart {
    position: fixed;
    top: -30px;
    font-size: 25px;
    animation: fall 4s linear forwards;
    pointer-events: none;
}

@keyframes fall {
    to {
        transform: translateY(110vh) rotate(360deg);
        opacity: 0;
    }
}
</style>
</head>

<body>

<div class="container" id="mainPage">

    <h1>Hi beautiful ❤️</h1>

    <p>Will you go on a date with me? 🥺</p>

    <div class="buttons">
        <button id="yesBtn" onclick="showDate()">YES ❤️</button>
        <button id="noBtn" onmouseover="runAway()" onclick="runAway()">NO 😭</button>
    </div>

</div>

<div class="container" id="datePage">

    <h1>YEHEY! ❤️</h1>

    <p>When are you available? 🥹</p>

    <input type="date" id="dateInput">

    <button id="confirmBtn" onclick="confirmDate()">
        Confirm Date 💗
    </button>

    <p id="status"></p>

</div>

<div id="surprise">

    <h1>SEE YOU SOON BEAUTIFUL HEHE ❤️</h1>

    <h2>EXCITED NAKAY KO HAHAHA 🥹</h2>

    <p>Ana gyud YES ba HAHAHA</p>

    <h2>You just made me the happiest person. 💗</h2>

    <h2>THIS IS HOW MUCH I ADORE YOU! HAHAHA ❤️</h2>

    <p id="chosenDate"></p>

</div>

<script>

function showDate() {
    document.getElementById("mainPage").style.display = "none";
    document.getElementById("datePage").style.display = "flex";
}

function runAway() {

    const noBtn = document.getElementById("noBtn");

    noBtn.style.position = "fixed";

    const maxX = window.innerWidth - noBtn.offsetWidth;
    const maxY = window.innerHeight - noBtn.offsetHeight;

    noBtn.style.left = Math.random() * maxX + "px";
    noBtn.style.top = Math.random() * maxY + "px";
}

async function confirmDate() {

    const date = document.getElementById("dateInput").value;
    const status = document.getElementById("status");
    const button = document.getElementById("confirmBtn");

    if (!date) {
        alert("Please choose a date first! ❤️");
        return;
    }

    button.disabled = true;
    button.textContent = "Sending... 💗";

    status.textContent = "Sending your date confirmation...";

    try {

        const response = await fetch(
            "https://formsubmit.co/ajax/jrsasing2@gmail.com",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json",
                    "Accept": "application/json"
                },

                body: JSON.stringify({

                    Date: date,

                    Message: "Someone selected a date for your Valentine's invitation! ❤️",

                    _subject: "New Date Confirmation ❤️"

                })
            }
        );

        const result = await response.json();

        if (!response.ok || result.success !== "true") {
            throw new Error("Email could not be sent.");
        }

        document.getElementById("datePage").style.display = "none";

        document.getElementById("surprise").style.display = "block";

        document.getElementById("chosenDate").textContent =
            "Our special date: " + date + " 💕";

        setInterval(createHeart, 150);

    } catch (error) {

        status.textContent =
            "Sorry! Email failed. Please try again. ❤️";

        button.disabled = false;
        button.textContent = "Confirm Date 💗";

        alert("Email could not be sent. Please check your internet connection and FormSubmit activation.");

    }
}

function createHeart() {

    const heart = document.createElement("div");

    heart.className = "heart";

    heart.textContent = "❤️";

    heart.style.left = Math.random() * 100 + "vw";

    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 4000);
}

</script>

</body>
</html>
